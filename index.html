<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моніторинг Вітрової Електростанції</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">
    <div class="container py-4">
        <header class="pb-3 mb-4 border-bottom text-center">
            <h1 class="display-5 fw-bold text-primary"><i class="bi bi-wind"></i> Вітрова електростанція</h1>
            <p class="fs-5 text-muted">Останнє оновлення: <span id="lastUpdate" class="fw-bold">--:--:--</span></p>
        </header>

        <div class="row mb-4">
            <div class="col-12 d-flex justify-content-center gap-3 align-items-center bg-white p-3 rounded shadow-sm">
                <button id="updateBtn" class="btn btn-primary px-4"><i class="bi bi-arrow-clockwise"></i> Оновити</button>
                <button id="autoUpdateBtn" class="btn btn-success px-4"><i class="bi bi-play-fill"></i> Автооновлення</button>

                <button id="testWindDownBtn" class="btn btn-secondary px-3 fw-bold"><i class="bi bi-arrow-down-circle"></i> -5 м/с</button>
                <button id="testWindBtn" class="btn btn-warning px-4 text-dark fw-bold"><i class="bi bi-wind"></i> +5 м/с (Тест)</button>
                <span class="badge bg-secondary fs-6" id="autoStatus">Вимкнено</span>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-md-4">
                <div class="alert alert-info d-flex align-items-center h-100 shadow-sm mb-0">
                    <div class="compass-container me-3">
                        <i class="bi bi-arrow-up-circle-fill text-primary" id="windDirectionIcon"></i>
                    </div>
                    <div>
                        <h6 class="mb-1">Напрямок вітру</h6>
                        <span id="windDirectionValue" class="fs-4 fw-bold">0</span>°
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div id="brakeAlert" class="alert alert-success d-flex align-items-center h-100 shadow-sm mb-0">
                    <i class="bi bi-shield-check fs-2 me-3" id="brakeIcon"></i>
                    <div>
                        <h6 class="mb-1">Гальмівна система</h6>
                        <span id="brakeStatus" class="fs-5 fw-bold">Вимкнена</span>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div id="criticalWindAlert" class="alert alert-success d-flex align-items-center h-100 shadow-sm mb-0">
                    <i class="bi bi-exclamation-triangle-fill fs-2 me-3"></i>
                    <div>
                        <h6 class="mb-1">Стан вітру</h6>
                        <span id="criticalStatus" class="fs-5 fw-bold">Норма</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4 mb-4">
            <div class="col-md-6 col-lg-3">
                <div class="card h-100 shadow-sm modern-card">
                    <div class="card-body text-center">
                        <h6 class="card-title text-muted">Швидкість вітру</h6>
                        <div class="my-3">
                            <span id="param-wind" class="display-5 fw-bold">0</span>
                            <span class="text-muted">м/с</span>
                        </div>
                        <div id="status-wind" class="badge rounded-pill fs-6 w-100">Статус</div>
                    </div>
                </div>
            </div>
            <div class="col-md-6 col-lg-3">
                <div class="card h-100 shadow-sm modern-card">
                    <div class="card-body text-center">
                        <h6 class="card-title text-muted">Обертання ротора</h6>
                        <div class="my-3">
                            <span id="param-rpm" class="display-5 fw-bold">0</span>
                            <span class="text-muted">об/хв</span>
                        </div>
                        <div id="status-rpm" class="badge rounded-pill fs-6 w-100">Статус</div>
                    </div>
                </div>
            </div>
            <div class="col-md-6 col-lg-3">
                <div class="card h-100 shadow-sm modern-card">
                    <div class="card-body text-center">
                        <h6 class="card-title text-muted">Вироблена потужність</h6>
                        <div class="my-3">
                            <span id="param-power" class="display-5 fw-bold">0</span>
                            <span class="text-muted">кВт</span>
                        </div>
                        <div id="status-power" class="badge rounded-pill fs-6 w-100">Статус</div>
                    </div>
                </div>
            </div>
            <div class="col-md-6 col-lg-3">
                <div class="card h-100 shadow-sm modern-card">
                    <div class="card-body text-center">
                        <h6 class="card-title text-muted">Кут нахилу лопатей</h6>
                        <div class="my-3">
                            <span id="param-angle" class="display-5 fw-bold">0</span>
                            <span class="text-muted">°</span>
                        </div>
                        <div id="status-angle" class="badge rounded-pill fs-6 w-100">Статус</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Графік генерованої потужності</h5>
                        <div class="chart-container" style="position: relative; height:300px;">
                            <canvas id="powerChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
